schema: spec-driven

context: |
  项目：kube-chart，Helm library Chart。
  Kubernetes API 基线：>= v1.36.0。
  Helm 基线：>= 4.0.0；推荐和验证目标为 4.2.2。
  实现范围仅限 Helm 内置函数、Go Template、Sprig 与 Helm 特有函数。
  使用中文编写变更材料，数字、英文与中文混排保留必要空格。
  这是既有项目：只为真实变更触及并验证的行为建立规格，不批量回填。
  已批准的当前规格与变更规格优先于代码；代码不一致时修复代码。

rules:
  proposal:
    - /sdd-new 必须提供 change-id、主要能力名和至少一个 define名称=tpl文件 映射；映射通过校验后先创建 proposal 记录原始目标。
    - 一个变更只处理一个模板或一组不可分割的能力。
    - proposal 是唯一用户输入源，正文只包含目标、需求、约束三节；用户也可通过会话让 AI 代写。
    - proposal 顶部摘要使用无序列表显示状态、change-id、主要能力，以及按目标顺序成对出现的命名模板和工作区相对存放路径。
    - 约束只保存用户明确指定的本次变更特殊限制，允许为空；禁止用项目基线、通用规则或 AI 推导内容预填。
    - AI 自行读取 AGENTS.md、适用规则、当前规格、目标代码和官方资料，不要求用户维护资料清单；用户特殊依据归入需求或约束。
    - 已确认模板使用 [x]，待确认子模板使用 [ ]、稳定编号和可直接修改的一行映射。
    - 顶层行为未知时在需求中记录具体 [待补充]；仅子模板缺失时创建占位并继续同步父模板材料。
  specs:
    - 规格是 AI 同步产物，需求修改入口始终是 proposal。
    - 只描述可观察的渲染或失败行为，不写实现步骤。
    - 每个 Requirement 至少包含一个 WHEN/THEN Scenario。
    - 适用时覆盖最小有效、代表性有效和关键非法输入。
    - 不得把静态代码推断直接写成已验证的当前行为。
    - 只通过稳定编号引用 proposal 的占位，不复制占位表；不得替未知子模板虚构 Requirement。
    - 根据项目上下文补充可观察的版本、类型、兼容性和失败边界，不回写 proposal 约束。
  design:
    - design 是 AI 同步产物，固定写入 artifacts/design.md，只记录真正影响实现的技术决策，不重复用户输入。
    - 模板变更读取 openspec/rules/helm-templates.md。
    - 调用或修改核心命名模板时读取 openspec/rules/core-capabilities.md。
    - 记录跨层级上下文、类型归一化、合并、兼容性和安全决策的理由与替代方案。
    - 通过稳定编号说明占位的上下文流和隔离边界；子模板完成前不得使用临时替身判定父模板通过验证。
    - 根据项目上下文补充实现、分层、安全和兼容性约束，不要求用户在 proposal 重复提供。
  tasks:
    - tasks 是 AI 同步产物，固定写入 artifacts/tasks.md，使用简短清单，不要求用户在此修改需求。
    - 包含批准、实现、文档同步和验证任务。
    - 每个已确认的 define名称=tpl文件 映射都有对应实现和验证任务。
    - 模板变更包含 /opt/homebrew/bin/helm lint 和可复现的渲染检查。
    - 临时验证资产只能位于 /tmp，完成后必须清理。
    - /sdd-new、批准前探索和 /sdd-apply 不创建 artifacts/verification.md；仅在正式目标全部实现且真实子模板可用后，由 /sdd-verify 根据实际检查创建。
    - artifacts/verification.md 不得记录草案推断、临时候选代码或测试替身结果；验证结果同时直接报告，只在全部检查通过后勾选对应任务。
    - 按父模板到子模板排序；占位依赖保留等待用户追加目标的未完成任务。
    - 根据项目上下文自动补充适用的开发、验证、文档和发布检查。
